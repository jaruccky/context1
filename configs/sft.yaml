# QLoRA SFT config for context_agent.training.sft. Requires a CUDA GPU to actually
# run (bitsandbytes 4-bit quantization) -- not exercised by this repo's test suite.
base_model: "Qwen/Qwen3-8B"
train_file: "data/trajectories/sft_train.jsonl"
output_dir: "artifacts/sft/qwen3-8b-context1"
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 0.0002
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_seq_length: 4096
